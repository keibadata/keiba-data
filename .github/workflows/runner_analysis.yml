name: Runner Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze runner histories
        run: python runner_analysis.py

      - name: Save runner analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner_analysis.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update runner analysis"
            git push
          fi
