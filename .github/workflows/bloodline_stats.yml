name: Bloodline Stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bloodline statistics
        run: python bloodline_stats.py

      - name: Save bloodline statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bloodline_stats.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update bloodline statistics"
            git push
          fi
