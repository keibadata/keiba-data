name: Preview Daily Race Analysis

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: "開催日（YYYY-MM-DD）"
        required: true
        type: string
      preview_time:
        description: "試験用の基準時刻（JST、HH:MM。通常は空欄）"
        required: false
        type: string
      run_reanalysis:
        description: "当日の発走前に馬体重が揃ったレースを再解析・保存する"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready_races: ${{ steps.preview.outputs.ready_races }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: python -m pip install -r requirements.txt

      - name: Preview JRA race list and body weights
        id: preview
        env:
          RACE_DATE: ${{ inputs.race_date }}
          PREVIEW_TIME: ${{ inputs.preview_time }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import date, datetime, time, timedelta, timezone
          from pathlib import Path
          from urllib.parse import parse_qs, urlsplit

          import requests
          from bs4 import BeautifulSoup

          from check_daily_body_weights import fetch_body_weights
          from resolve_race_id import HEADERS, TRACK_CODES

          JST = timezone(timedelta(hours=9))
          CHECK_WINDOW = timedelta(minutes=60)

          race_date = os.environ["RACE_DATE"].strip()
          if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", race_date):
              raise SystemExit("開催日は YYYY-MM-DD で入力してください。")
          target_date = date.fromisoformat(race_date)
          ymd = target_date.strftime("%Y%m%d")
          preview_time = os.environ["PREVIEW_TIME"].strip()
          if preview_time and not re.fullmatch(r"(?:[01]\d|2[0-3]):[0-5]\d", preview_time):
              raise SystemExit("試験用の基準時刻は HH:MM で入力してください。")

          response = requests.get(
              "https://race.netkeiba.com/top/race_list_sub.html",
              params={"kaisai_date": ymd},
              headers=HEADERS,
              timeout=30,
              allow_redirects=False,
          )
          response.raise_for_status()
          if response.status_code != 200:
              raise SystemExit(f"開催一覧を取得できません。HTTP {response.status_code}")

          soup = BeautifulSoup(response.content, "html.parser")
          race_list = soup.select_one("#RaceTopRace .RaceList_Box")
          if race_list is None:
              raise SystemExit("開催一覧のHTML構造を確認できません。")

          rows = []
          seen = set()
          for meeting in race_list.select("dl.RaceList_DataList"):
              header = meeting.select_one(".RaceList_DataTitle")
              meeting_text = header.get_text(" ", strip=True) if header else ""
              match = re.fullmatch(r"(\d+)回\s*(\S+)\s*(\d+)日目", meeting_text)
              if not match or match[2] not in TRACK_CODES:
                  raise SystemExit(f"JRAの開催場を照合できません。{meeting_text}")

              meeting_no, track, day_no = match.groups()
              prefix = (
                  f"{target_date.year:04d}{TRACK_CODES[track]}"
                  f"{int(meeting_no):02d}{int(day_no):02d}"
              )
              payback = meeting.select_one("a.LinkHaraimodoshiichiran[href]")
              if payback:
                  metadata = parse_qs(urlsplit(payback["href"]).query)
                  if metadata.get("kaisai_date") != [ymd] or metadata.get("kaisai_id") != [prefix]:
                      raise SystemExit(f"一覧の開催日・開催IDが一致しません。{meeting_text}")

              items = meeting.select("li.RaceList_DataItem")
              if not items:
                  raise SystemExit(f"開催場のレース一覧が空です。{meeting_text}")

              for item in items:
                  number_node = item.select_one(".Race_Num")
                  number_text = number_node.get_text(strip=True) if number_node else ""
                  number = re.fullmatch(r"(1[0-2]|[1-9])R", number_text)
                  link = item.select_one('a[href*="race_id="]')
                  ids = parse_qs(urlsplit(link["href"]).query).get("race_id") if link else None
                  race_id = f"{prefix}{int(number[1]):02d}" if number else ""
                  if not race_id or ids != [race_id] or race_id in seen:
                      raise SystemExit(f"レースIDを照合できません。{meeting_text} {number_text} {ids}")
                  seen.add(race_id)

                  title_node = item.select_one(".ItemTitle")
                  title = title_node.get_text(" ", strip=True) if title_node else ""
                  time_node = item.select_one(".RaceList_Itemtime")
                  start = time_node.get_text(strip=True) if time_node else ""
                  data = item.select_one(".RaceData")
                  course = data.get_text(" ", strip=True) if data else ""
                  if re.search(r"中止|取り?止め|不成立", item.get_text(" ", strip=True)):
                      status = "除外（中止・不成立）"
                  elif "障害" in title or re.search(r"障(?:害)?\s*\d{3,4}\s*m", course):
                      status = "除外（障害）"
                  elif not re.search(r"(?:芝|ダ(?:ート)?)\s*\d{3,4}\s*m", course):
                      status = "保留（コース不明）"
                  elif not re.fullmatch(r"(?:[01]?\d|2[0-3]):[0-5]\d", start):
                      status = "保留（発走時刻不明）"
                  else:
                      hour, minute = map(int, start.split(":"))
                      start = time(hour, minute).strftime("%H:%M")
                      status = "対象"

                  title = title.replace("|", "｜") or "不明"
                  rows.append((track, number_text, start or "不明", title, race_id, status))

          if not rows:
              raise SystemExit(f"{race_date} のJRA開催一覧に掲載がありません。開催の有無は不明です。")

          eligible = sum(row[-1] == "対象" for row in rows)
          excluded = sum(row[-1].startswith("除外") for row in rows)
          pending = len(rows) - eligible - excluded
          checked_at = (
              datetime.combine(target_date, time.fromisoformat(preview_time), JST)
              if preview_time else datetime.now(JST)
          )
          ready_races = []
          ready_count = 0
          error_count = 0
          report = [
              f"## {race_date} JRA開催一覧（発走時刻はJST）",
              "",
              f"掲載 {len(rows)}件 / 対象 {eligible}件 / 除外 {excluded}件 / 保留 {pending}件",
              "",
              f"判定基準: {checked_at:%Y-%m-%d %H:%M:%S} JST",
          ]
          if preview_time:
              report.append("試験モード。馬体重は実行時点の出馬表を使用します。")
          report.extend([
              "",
              "| 競馬場 | R | 発走 | レース名 | レースID | 判定 | 馬体重 |",
              "|---|---|---|---|---|---|---|",
          ])

          for row in rows:
              _, _, start, _, race_id, status = row
              weight_status = "対象外"
              if status == "対象":
                  start_at = datetime.combine(target_date, time.fromisoformat(start), JST)
                  now = checked_at if preview_time else datetime.now(JST)
                  if now.date() < target_date:
                      weight_status = "開催日前"
                  elif now >= start_at:
                      weight_status = "発走時刻経過"
                  elif start_at - now > CHECK_WINDOW:
                      weight_status = "確認時刻前"
                  else:
                      try:
                          result = fetch_body_weights(race_id)
                      except (requests.RequestException, ValueError) as exc:
                          print(f"{race_id}: 馬体重確認失敗: {exc}")
                          weight_status = "確認失敗"
                          error_count += 1
                      else:
                          published = result["published_count"]
                          total = result["runner_count"]
                          if not preview_time and datetime.now(JST) >= start_at:
                              weight_status = "確認中に発走時刻経過"
                          elif result["status"] == "ready":
                              weight_status = f"全頭発表済み {published}/{total}頭"
                              ready_count += 1
                              if not preview_time:
                                  ready_races.append({
                                      "race_id": race_id,
                                      "start_at": start_at.isoformat(),
                                      "weight_signature": result["weight_signature"],
                                  })
                          elif result["status"] == "no_active_runners":
                              weight_status = "出走馬なし"
                          else:
                              weight_status = f"発表待ち {published}/{total}頭"
              report.append("| " + " | ".join((*row, weight_status)) + " |")

          completed_at = datetime.now(JST)
          ready_races = [
              race for race in ready_races
              if datetime.fromisoformat(race["start_at"]) > completed_at
          ]
          ready_races.sort(key=lambda race: (race["start_at"], race["race_id"]))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              print(f"ready_races={json.dumps(ready_races)}", file=output_file)
          report.extend(["", f"全頭発表済み {ready_count}件 / 確認失敗 {error_count}件"])
          output = "\n".join(report) + "\n"
          print(output, end="")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(output, encoding="utf-8")
          PY

  reanalyze:
    name: Reanalyze ${{ matrix.race.race_id }}
    needs: preview
    if: ${{ github.ref == 'refs/heads/main' && inputs.run_reanalysis && inputs.preview_time == '' && needs.preview.outputs.ready_races != '' && needs.preview.outputs.ready_races != '[]' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        race: ${{ fromJSON(needs.preview.outputs.ready_races) }}
    uses: ./.github/workflows/final_analysis.yml
    with:
      race_id: ${{ matrix.race.race_id }}
      race_start_at: ${{ matrix.race.start_at }}
      body_weight_signature: ${{ matrix.race.weight_signature }}
