name: Previous Race Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze previous races
        run: python previous_race_analysis.py

      - name: Save previous race analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add previous_race_analysis.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update previous race analysis"
            git push
          fi
