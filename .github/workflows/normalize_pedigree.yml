name: Normalize Pedigree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize pedigree names
        run: python normalize_pedigree.py

      - name: Rebuild bloodline statistics
        run: python bloodline_stats.py

      - name: Recalculate race bloodline scores
        run: python race_bloodline_score.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history_pedigree.json
          git add bloodline_stats.json
          git add race_bloodline_score.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Normalize pedigree and rebuild bloodline scores"
            git push
          fi
