name: Race Full Analysis

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: "開催日 YYYY/MM/DD"
        required: false
        type: string
      race_track:
        description: "競馬場 例: 東京"
        required: false
        type: string
      race_no:
        description: "R番号 1-12"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: race-full-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Resolve or load race ID
        env:
          RACE_DATE: ${{ inputs.race_date }}
          RACE_TRACK: ${{ inputs.race_track }}
          RACE_NO: ${{ inputs.race_no }}
        run: |
          if [ -n "$RACE_DATE" ] || [ -n "$RACE_TRACK" ] || [ -n "$RACE_NO" ]; then
            if [ -z "$RACE_DATE" ] || [ -z "$RACE_TRACK" ] || [ -z "$RACE_NO" ]; then
              echo "ERROR: race_date / race_track / race_no must all be supplied"
              exit 1
            fi

            echo "Automatic Race ID resolution"
            echo "Date : $RACE_DATE"
            echo "Track: $RACE_TRACK"
            echo "Race : ${RACE_NO}R"

            python resolve_race_id.py
          else
            echo "No race selection inputs."
            echo "Using existing race_id.txt."
          fi

          RACE_ID="$(tr -d '[:space:]' < race_id.txt)"

          if ! echo "$RACE_ID" | grep -Eq '^[0-9]{12}$'; then
            echo "ERROR: race_id.txt must contain exactly 12 digits"
            exit 1
          fi

          echo "RACE_ID=$RACE_ID" >> "$GITHUB_ENV"
          echo "Target Race ID: $RACE_ID"

      # ===================================================
      # 対象レース
      # ===================================================

      - name: Collect race
        run: |
          python main_v3.py

      # ===================================================
      # JRA馬場情報
      # ===================================================

      - name: Build track condition
        run: |
          python track_condition.py

      # ===================================================
      # 当日バイアス
      #
      # 対象Rより前のレースだけ取得。
      # 対象R以降は使用しない。
      # ===================================================

      - name: Collect previous day races
        run: |
          python day_races.py

      - name: Run day bias
        run: |
          python day_bias.py

      - name: Validate day bias
        run: |
          python - <<'PY'
          import json
          import sys

          with open(
              "race.json",
              "r",
              encoding="utf-8"
          ) as f:
              race = json.load(f)

          with open(
              "day_races.json",
              "r",
              encoding="utf-8"
          ) as f:
              day_races = json.load(f)

          with open(
              "day_bias.json",
              "r",
              encoding="utf-8"
          ) as f:
              day_bias = json.load(f)

          race_id = str(
              race.get("race_id", "")
          ).strip()

          if str(
              day_races.get("race_id", "")
          ).strip() != race_id:
              sys.exit(
                  "ERROR: day_races race ID mismatch"
              )

          if str(
              day_bias.get("race_id", "")
          ).strip() != race_id:
              sys.exit(
                  "ERROR: day_bias race ID mismatch"
              )

          target_race_number = int(
              race_id[-2:]
          )

          for item in day_races.get(
              "collected_races",
              []
          ):
              race_number = int(
                  item.get("race_number", 0)
                  or 0
              )

              if race_number >= target_race_number:
                  sys.exit(
                      "ERROR: future race data detected"
                  )

          if day_races.get(
              "future_race_usage"
          ) is not False:
              sys.exit(
                  "ERROR: day_races future race flag"
              )

          if day_bias.get(
              "future_race_usage"
          ) is not False:
              sys.exit(
                  "ERROR: day_bias future race flag"
              )

          print(
              "DAY BIAS VALIDATION OK"
          )

          print(
              "bias:",
              day_bias.get(
                  "running_style_bias"
              )
          )

          print(
              "confidence:",
              day_bias.get(
                  "confidence"
              )
          )

          print(
              "analyzed races:",
              day_bias.get(
                  "analyzed_race_count"
              )
          )
          PY

      # ===================================================
      # 条件別過去データ
      # ===================================================

      - name: Find condition history races
        run: |
          python history_batch.py

      - name: Update history database
        run: |
          python history_db.py

      - name: Update history pedigrees
        run: |
          python history_pedigree.py

      - name: Select condition history
        run: |
          python condition_history.py

      # ===================================================
      # 血統
      # ===================================================

      - name: Collect pedigree
        run: |
          python pedigree.py

      - name: Normalize pedigree
        run: |
          python normalize_pedigree.py

      # ===================================================
      # 各馬履歴
      # ===================================================

      - name: Collect runner history
        run: |
          python runner_history.py

      - name: Analyze runners
        run: |
          python runner_analysis.py

      # ===================================================
      # 前走処理
      # ===================================================

      - name: Analyze previous race
        run: |
          python previous_race_analysis.py

      # ===================================================
      # 展開
      # ===================================================

      - name: Analyze pace
        run: |
          python pace_analysis.py

      # ===================================================
      # 血統統計
      # ===================================================

      - name: Build bloodline statistics
        run: |
          python bloodline_stats.py

      - name: Score race bloodlines
        run: |
          python race_bloodline_score.py

      # ===================================================
      # 最終解析
      # ===================================================

      - name: Run final analysis
        run: |
          python final_analysis.py

      # ===================================================
      # 最終検証
      # ===================================================

      - name: Validate final analysis
        run: |
          python - <<'PY'
          import json
          import sys

          with open(
              "final_analysis.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          summary = data.get(
              "summary",
              {}
          )

          runner_count = summary.get(
              "runner_count",
              0
          )

          ranked_count = summary.get(
              "ranked_count",
              0
          )

          checks = {
              "ability":
                  summary.get(
                      "ability_connected_count",
                      0
                  ),

              "previous":
                  summary.get(
                      "previous_connected_count",
                      0
                  ),

              "pace":
                  summary.get(
                      "pace_connected_count",
                      0
                  ),

              "bloodline":
                  summary.get(
                      "bloodline_connected_count",
                      0
                  ),

              "body_weight":
                  summary.get(
                      "body_weight_connected_count",
                      0
                  ),
          }

          print(
              "runner_count:",
              runner_count
          )

          print(
              "ranked_count:",
              ranked_count
          )

          for name, value in checks.items():

              print(
                  name + ":",
                  value,
                  "/",
                  runner_count
              )

          if runner_count <= 0:

              sys.exit(
                  "ERROR: runner_count = 0"
              )

          if ranked_count != runner_count:

              sys.exit(
                  "ERROR: ranking incomplete"
              )

          for name, value in checks.items():

              if value != runner_count:

                  sys.exit(
                      "ERROR: "
                      + name
                      + " connection incomplete"
                  )

          track = data.get(
              "track_condition",
              {}
          )

          print(
              "track source available:",
              track.get(
                  "source_available"
              )
          )

          print(
              "track race id matched:",
              track.get(
                  "race_id_matched"
              )
          )

          print(
              "track applied:",
              track.get(
                  "applied"
              )
          )

          if (
              track.get(
                  "source_available"
              )
              and not track.get(
                  "race_id_matched"
              )
          ):

              sys.exit(
                  "ERROR: track condition race ID mismatch"
              )

          print(
              "FULL ANALYSIS VALIDATION OK"
          )
          PY

      # ===================================================
      # 保存
      # ===================================================

      - name: Save analysis data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            race_id.txt \
            race.json \
            track_condition.json \
            day_races.json \
            day_bias.json \
            history_races.json \
            history_db.json \
            history_pedigree.json \
            condition_history.json \
            pedigree.json \
            runner_history.json \
            runner_analysis.json \
            previous_race_analysis.json \
            pace_analysis.json \
            bloodline_stats.json \
            race_bloodline_score.json \
            final_analysis.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Run full race analysis"
          git push
