name: Race Full Analysis

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: "開催日 YYYY/MM/DD"
        required: false
        type: string
      race_track:
        description: "競馬場 例: 東京"
        required: false
        type: string
      race_no:
        description: "R番号 1-12"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: race-full-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      # 0. Race IDを決定
      #
      # 新方式:
      # 開催日 + 競馬場 + R番号
      #   ↓
      # resolve_race_id.py
      #   ↓
      # race_id.txt
      #
      # 旧方式:
      # 入力が無い場合は従来通りrace_id.txtを使用
      - name: Resolve or load race ID
        env:
          RACE_DATE: ${{ inputs.race_date }}
          RACE_TRACK: ${{ inputs.race_track }}
          RACE_NO: ${{ inputs.race_no }}
        run: |
          if [ -n "$RACE_DATE" ] || [ -n "$RACE_TRACK" ] || [ -n "$RACE_NO" ]; then

            if [ -z "$RACE_DATE" ] || [ -z "$RACE_TRACK" ] || [ -z "$RACE_NO" ]; then
              echo "ERROR: race_date / race_track / race_no must all be supplied"
              exit 1
            fi

            echo "Automatic Race ID resolution"
            echo "Date : $RACE_DATE"
            echo "Track: $RACE_TRACK"
            echo "Race : ${RACE_NO}R"

            python resolve_race_id.py

          else

            echo "No race selection inputs."
            echo "Using existing race_id.txt."

          fi

          RACE_ID="$(tr -d '[:space:]' < race_id.txt)"

          if ! echo "$RACE_ID" | grep -Eq '^[0-9]{12}$'; then
            echo "ERROR: race_id.txt must contain exactly 12 digits"
            exit 1
          fi

          echo "RACE_ID=$RACE_ID" >> "$GITHUB_ENV"
          echo "Target Race ID: $RACE_ID"

      # 1. 今回レース取得
      - name: Collect race
        run: |
          python main_v3.py

      # 2. 今回条件の過去レースを探索
      - name: Find condition history races
        run: |
          python history_batch.py

      # 3. 過去レースDBを条件横断で蓄積
      - name: Update history database
        run: |
          python history_db.py

      # 4. 履歴DBに追加された馬の5代血統を増分取得
      - name: Update history pedigrees
        run: |
          python history_pedigree.py

      # 5. 今回条件だけを履歴DBから抽出
      - name: Select condition history
        run: |
          python condition_history.py

      # 6. 今回出走馬の5代血統
      - name: Collect pedigree
        run: |
          python pedigree.py

      # 7. 今回出走馬の血統名を正規化
      - name: Normalize pedigree
        run: |
          python normalize_pedigree.py

      # 8. 今回出走馬の過去成績
      - name: Collect runner history
        run: |
          python runner_history.py

      # 9. 能力・今回能力発揮率
      - name: Analyze runners
        run: |
          python runner_analysis.py

      # 10. 前走処理・課題・克服材料
      - name: Analyze previous race
        run: |
          python previous_race_analysis.py

      # 11. 展開
      - name: Analyze pace
        run: |
          python pace_analysis.py

      # 12. 今回条件の血統統計
      - name: Build bloodline statistics
        run: |
          python bloodline_stats.py

      # 13. 今回出走馬の血統評価
      - name: Score race bloodlines
        run: |
          python race_bloodline_score.py

      # 14. 最終統合
      - name: Run final analysis
        run: |
          python final_analysis.py

      # 15. 完成チェック
      - name: Validate final analysis
        run: |
          python - <<'PY'
          import json
          import sys

          with open(
              "final_analysis.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          summary = data.get("summary", {})

          runner_count = summary.get(
              "runner_count",
              0
          )

          ranked_count = summary.get(
              "ranked_count",
              0
          )

          checks = {
              "ability":
                  summary.get(
                      "ability_connected_count",
                      0
                  ),

              "previous":
                  summary.get(
                      "previous_connected_count",
                      0
                  ),

              "pace":
                  summary.get(
                      "pace_connected_count",
                      0
                  ),

              "bloodline":
                  summary.get(
                      "bloodline_connected_count",
                      0
                  )
          }

          print(
              "runner_count:",
              runner_count
          )

          print(
              "ranked_count:",
              ranked_count
          )

          for name, value in checks.items():
              print(
                  name + ":",
                  value,
                  "/",
                  runner_count
              )

          if runner_count <= 0:
              sys.exit(
                  "ERROR: runner_count = 0"
              )

          if ranked_count != runner_count:
              sys.exit(
                  "ERROR: ranking incomplete"
              )

          for name, value in checks.items():
              if value != runner_count:
                  sys.exit(
                      "ERROR: "
                      + name
                      + " connection incomplete"
                  )

          print(
              "FULL ANALYSIS VALIDATION OK"
          )
          PY

      # 16. JSON + Race IDを保存
      - name: Save analysis data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            race_id.txt \
            race.json \
            history_races.json \
            history_db.json \
            history_pedigree.json \
            condition_history.json \
            pedigree.json \
            runner_history.json \
            runner_analysis.json \
            previous_race_analysis.json \
            pace_analysis.json \
            bloodline_stats.json \
            race_bloodline_score.json \
            final_analysis.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Run full race analysis"
          git push
