name: Daily Body Weight Check

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: "JRAレースID（半角数字12桁）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: python -m pip install -r requirements.txt

      - name: Check JRA body weight publication
        env:
          RACE_ID: ${{ inputs.race_id }}
        run: |
          result_file="$(mktemp)"
          python check_daily_body_weights.py --race-id "$RACE_ID" > "$result_file"

          python - "$result_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          status = {
              "ready": "全頭発表済み",
              "pending": "発表待ち",
              "no_active_runners": "出走馬なし",
          }[result["status"]]
          report = (
              f"## レースID {result['race_id']}\n\n"
              f"- 判定: {status}\n"
              f"- 馬体重発表済み: {result['published_count']} / {result['runner_count']}頭\n"
              f"- 取消・除外: {result['excluded_count']}頭\n"
          )
          print(report, end="")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(report)
          PY
