name: Fetch Keiba Data

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: "netkeiba race ID (12 digits)"
        required: true
        default: "202605040502"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Fetch current race
        run: python main.py "${{ inputs.race_id }}"

      - name: Fetch pedigree
        run: python pedigree.py

      - name: Fetch historical result
        id: history
        continue-on-error: true
        run: python history.py "${{ inputs.race_id }}"

      - name: Save generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update race data and debug files"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Fail if historical result failed
        if: steps.history.outcome == 'failure'
        run: |
          echo "Historical result fetch failed."
          echo "history_debug.html should now be saved in the repository."
          exit 1
