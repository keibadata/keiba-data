name: Fetch Keiba Data

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: "netkeiba race ID (12 digits)"
        required: true
        default: "202605040502"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Fetch current race
        run: python main.py "${{ inputs.race_id }}"

      - name: Fetch pedigree
        run: python pedigree.py "${{ inputs.race_id }}"

      - name: Fetch historical result
        id: history
        continue-on-error: true
        run: python history.py "${{ inputs.race_id }}"

      - name: Save generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add race.json pedigree.json history.json history_debug.html 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update race data ${{ inputs.race_id }}"
            git push
          fi
