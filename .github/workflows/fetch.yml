name: Fetch Keiba Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Fetch current race
        run: python main.py "202605040502"

      - name: Fetch pedigree
        run: python pedigree.py

      - name: Fetch historical result
        continue-on-error: true
        run: python history.py "202605040502"

      - name: Show history debug
        if: always()
        run: |
          if [ -f history_debug.html ]; then
            echo "=== DEBUG START ==="
            grep -o -E '<title[^>]*>.*</title>|/horse/[0-9]+|RaceTable[^ "<]*|HorseList[^ "<]*' history_debug.html | head -100 || true
            echo "=== DEBUG END ==="
          else
            echo "history_debug.html not found"
          fi

      - name: Save generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add race.json pedigree.json history.json history_debug.html 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update keiba data"
            git push
          fi
