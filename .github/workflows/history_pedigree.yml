name: History Pedigree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Collect historical pedigrees
        run: python history_pedigree.py

      - name: Save pedigree database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f history_pedigree.json ]; then
            git add history_pedigree.json

            if git diff --cached --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Update historical pedigree database"
              git push
            fi
          else
            echo "history_pedigree.json was not created"
            exit 1
          fi
