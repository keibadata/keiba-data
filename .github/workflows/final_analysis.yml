name: Race Full Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: race-full-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      # ==================================================
      # 今回レース
      # ==================================================

      - name: Load race ID
        run: |
          RACE_ID="$(tr -d '[:space:]' < race_id.txt)"

          if ! [[ "$RACE_ID" =~ ^[0-9]{12}$ ]]; then
            echo "ERROR: race_id.txt must contain exactly 12 digits"
            exit 1
          fi

          echo "RACE_ID=$RACE_ID" >> "$GITHUB_ENV"
          echo "Target race: $RACE_ID"

      - name: Collect race
        run: python main_v3.py

      # ==================================================
      # 過去DB
      #
      # history_db.json は既存キャッシュを使用
      # Full Analysisでは再収集しない
      # ==================================================

      - name: Validate cached history database
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          path = "history_db.json"

          if not os.path.exists(path):
              sys.exit("ERROR: history_db.json is missing")

          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              sys.exit(
                  "ERROR: history_db.json cannot be loaded: "
                  + str(exc)
              )

          if isinstance(data, dict):
              races = data.get("races", [])
          elif isinstance(data, list):
              races = data
          else:
              races = []

          if not isinstance(races, list) or not races:
              sys.exit("ERROR: history_db.json has no race data")

          print(
              "Cached history database OK:",
              len(races),
              "races"
          )
          PY

      - name: Build condition history
        run: python condition_history.py

      # ==================================================
      # 当日データ
      # ==================================================

      - name: Collect day races
        run: python day_races.py

      - name: Build day time history
        run: python day_time_history.py

      - name: Collect track condition
        run: python track_condition.py

      - name: Analyze day bias
        run: python day_bias.py

      # ==================================================
      # 血統
      # ==================================================

      - name: Collect pedigree
        run: python pedigree.py

      - name: Normalize pedigree
        run: python normalize_pedigree.py

      - name: Collect history pedigree
        run: python history_pedigree.py

      # ==================================================
      # 出走馬過去成績
      # ==================================================

      - name: Collect runner history
        run: python runner_history.py

      - name: Collect runner race database
        run: python runner_race_db.py

      - name: Analyze runner time fit
        run: python runner_time_fit.py

      # ==================================================
      # 個別解析
      #
      # 調教は使用しない
      # ==================================================

      - name: Analyze runners
        run: python runner_analysis.py

      - name: Analyze previous race
        run: python previous_race_analysis.py

      - name: Analyze pace
        run: python pace_analysis.py

      # ==================================================
      # 血統統計
      # ==================================================

      - name: Build bloodline statistics
        run: python bloodline_stats.py

      - name: Score race bloodlines
        run: python race_bloodline_score.py

      # ==================================================
      # 最終統合
      #
      # 1. 通常解析を実行
      # 2. 新馬戦なら血統専用解析で上書き
      #    通常戦では newcomer_final_analysis.py はSKIP
      # ==================================================

      - name: Run final analysis
        run: python final_analysis.py

      - name: Apply newcomer pedigree-only analysis
        run: python newcomer_final_analysis.py

      # ==================================================
      # 最終安全チェック
      # ==================================================

      - name: Validate final analysis
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          race_id = os.environ["RACE_ID"]

          with open(
              "final_analysis.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if str(
              data.get("race_id", "")
          ).strip() != race_id:
              sys.exit(
                  "ERROR: final_analysis race_id mismatch"
              )

          summary = data.get(
              "summary",
              {}
          )

          ranking = data.get(
              "ranking",
              []
          )

          total = int(
              summary.get(
                  "runner_count",
                  0
              ) or 0
          )

          if total <= 0:
              sys.exit(
                  "ERROR: no runners"
              )

          if len(ranking) != total:
              sys.exit(
                  f"ERROR: ranking record count mismatch "
                  f"({len(ranking)}/{total})"
              )

          analysis_mode = str(
              data.get(
                  "analysis_mode",
                  ""
              )
          ).strip()

          is_newcomer = (
              analysis_mode
              == "newcomer_pedigree_only"
          )

          print(
              "Target race:",
              race_id
          )

          print(
              "Runners:",
              total
          )

          print(
              "Analysis mode:",
              (
                  analysis_mode
                  if analysis_mode
                  else "normal"
              )
          )

          # ==================================================
          # 新馬戦
          #
          # 血統だけで評価。
          # 能力・前走・展開・馬場・時計・馬体等は
          # 最終点へ一切入れない。
          # ==================================================

          if is_newcomer:
              if not data.get(
                  "is_debut",
                  False
              ):
                  sys.exit(
                      "ERROR: newcomer mode without is_debut"
                  )

              method = data.get(
                  "method",
                  {}
              )

              if not method.get(
                  "pedigree_only",
                  False
              ):
                  sys.exit(
                      "ERROR: newcomer mode is not pedigree_only"
                  )

              forbidden_method_flags = (
                  "ability_used",
                  "previous_race_used",
                  "pace_used",
                  "training_used",
                  "jockey_used",
                  "draw_used",
                  "body_weight_used",
                  "popularity_used",
                  "track_bias_used",
                  "time_fit_used",
              )

              for key in forbidden_method_flags:
                  if method.get(
                      key,
                      False
                  ):
                      sys.exit(
                          "ERROR: forbidden newcomer factor enabled: "
                          + key
                      )

              scored_count = int(
                  summary.get(
                      "pedigree_scored_count",
                      0
                  ) or 0
              )

              missing_count = int(
                  summary.get(
                      "pedigree_missing_count",
                      0
                  ) or 0
              )

              ranked_count = int(
                  summary.get(
                      "ranked_count",
                      0
                  ) or 0
              )

              unranked_count = int(
                  summary.get(
                      "unranked_unknown_count",
                      0
                  ) or 0
              )

              if (
                  scored_count
                  + missing_count
                  != total
              ):
                  sys.exit(
                      "ERROR: newcomer pedigree "
                      "scored/missing count mismatch"
                  )

              if ranked_count != scored_count:
                  sys.exit(
                      "ERROR: newcomer ranked count "
                      "must equal pedigree scored count"
                  )

              if unranked_count != missing_count:
                  sys.exit(
                      "ERROR: newcomer unranked count "
                      "must equal pedigree missing count"
                  )

              if scored_count <= 0:
                  sys.exit(
                      "ERROR: newcomer has no pedigree scores"
                  )

              actual_ranked = 0
              actual_missing = 0

              actual_ranks = []

              for horse in ranking:
                  name = str(
                      horse.get(
                          "horse_name",
                          ""
                      )
                  )

                  horse_mode = str(
                      horse.get(
                          "analysis_mode",
                          ""
                      )
                  ).strip()

                  if (
                      horse_mode
                      != "newcomer_pedigree_only"
                  ):
                      sys.exit(
                          "ERROR: horse analysis mode mismatch: "
                          + name
                      )

                  bloodline_score = horse.get(
                      "bloodline_score"
                  )

                  final_score = horse.get(
                      "final_score"
                  )

                  rank = horse.get(
                      "rank"
                  )

                  ability_score = horse.get(
                      "ability_score"
                  )

                  performance_rate = horse.get(
                      "performance_rate"
                  )

                  condition_fit = horse.get(
                      "condition_fit_score"
                  )

                  if ability_score is not None:
                      sys.exit(
                          "ERROR: newcomer ability score used: "
                          + name
                      )

                  if performance_rate is not None:
                      sys.exit(
                          "ERROR: newcomer performance rate used: "
                          + name
                      )

                  if condition_fit is not None:
                      sys.exit(
                          "ERROR: newcomer condition fit used: "
                          + name
                      )

                  forbidden_adjustments = {
                      "track":
                          horse.get(
                              "track_performance_rate_adjustment",
                              0
                          ),
                      "time_fit":
                          horse.get(
                              "time_fit_performance_rate_adjustment",
                              0
                          ),
                      "body_weight":
                          horse.get(
                              "body_weight_performance_rate_adjustment",
                              0
                          ),
                      "body_issue":
                          horse.get(
                              "body_weight_issue_adjustment",
                              0
                          ),
                      "condition":
                          horse.get(
                              "condition_adjustment",
                              0
                          ),
                      "previous":
                          horse.get(
                              "previous_race_adjustment",
                              0
                          ),
                      "pace":
                          horse.get(
                              "pace_adjustment",
                              0
                          ),
                      "bloodline_support":
                          horse.get(
                              "bloodline_adjustment",
                              0
                          ),
                  }

                  for (
                      factor_name,
                      value
                  ) in forbidden_adjustments.items():
                      try:
                          numeric_value = float(
                              value or 0
                          )
                      except (
                          TypeError,
                          ValueError
                      ):
                          sys.exit(
                              "ERROR: invalid newcomer adjustment "
                              + factor_name
                              + ": "
                              + name
                          )

                      if abs(
                          numeric_value
                      ) > 1e-9:
                          sys.exit(
                              "ERROR: newcomer non-pedigree "
                              "adjustment detected: "
                              + factor_name
                              + " / "
                              + name
                          )

                  if bloodline_score is None:
                      actual_missing += 1

                      if final_score is not None:
                          sys.exit(
                              "ERROR: newcomer missing pedigree "
                              "received final score: "
                              + name
                          )

                      if rank is not None:
                          sys.exit(
                              "ERROR: newcomer missing pedigree "
                              "was ranked: "
                              + name
                          )

                  else:
                      actual_ranked += 1

                      if final_score is None:
                          sys.exit(
                              "ERROR: newcomer pedigree horse "
                              "has no final score: "
                              + name
                          )

                      try:
                          bloodline_value = float(
                              bloodline_score
                          )

                          final_value = float(
                              final_score
                          )
                      except (
                          TypeError,
                          ValueError
                      ):
                          sys.exit(
                              "ERROR: invalid newcomer score: "
                              + name
                          )

                      if abs(
                          final_value
                          - bloodline_value
                      ) > 1e-9:
                          sys.exit(
                              "ERROR: newcomer final score "
                              "must equal bloodline score: "
                              + name
                          )

                      if rank is None:
                          sys.exit(
                              "ERROR: newcomer pedigree horse "
                              "has no rank: "
                              + name
                          )

                      try:
                          rank_int = int(
                              rank
                          )
                      except (
                          TypeError,
                          ValueError
                      ):
                          sys.exit(
                              "ERROR: invalid newcomer rank: "
                              + name
                          )

                      actual_ranks.append(
                          rank_int
                      )

              if actual_ranked != scored_count:
                  sys.exit(
                      "ERROR: actual newcomer ranked count mismatch"
                  )

              if actual_missing != missing_count:
                  sys.exit(
                      "ERROR: actual newcomer missing count mismatch"
                  )

              expected_ranks = list(
                  range(
                      1,
                      scored_count + 1
                  )
              )

              if (
                  actual_ranks
                  != expected_ranks
              ):
                  sys.exit(
                      "ERROR: newcomer ranks are not continuous"
                  )

              # 血統点の降順になっているか
              ranked_horses = [
                  horse
                  for horse in ranking
                  if horse.get(
                      "rank"
                  ) is not None
              ]

              for index in range(
                  1,
                  len(ranked_horses)
              ):
                  previous_score = float(
                      ranked_horses[
                          index - 1
                      ][
                          "bloodline_score"
                      ]
                  )

                  current_score = float(
                      ranked_horses[
                          index
                      ][
                          "bloodline_score"
                      ]
                  )

                  if (
                      current_score
                      > previous_score
                      + 1e-9
                  ):
                      sys.exit(
                          "ERROR: newcomer ranking "
                          "is not bloodline score descending"
                      )

              print()
              print(
                  "===== NEWCOMER VALIDATION OK ====="
              )

              print(
                  "Pedigree scored:",
                  f"{scored_count}/{total}"
              )

              print(
                  "Pedigree missing:",
                  f"{missing_count}/{total}"
              )

              print(
                  "Ranked:",
                  f"{ranked_count}/{total}"
              )

              print(
                  "Final score:",
                  "BLOODLINE ONLY"
              )

              print(
                  "Normal race factors:",
                  "DISABLED"
              )

          # ==================================================
          # 通常戦
          #
          # 既存ルールを維持。
          # ==================================================

          else:
              record_checks = {
                  "ability records": int(
                      summary.get(
                          "ability_record_connected_count",
                          0
                      ) or 0
                  ),
                  "previous records": int(
                      summary.get(
                          "previous_connected_count",
                          0
                      ) or 0
                  ),
                  "pace records": int(
                      summary.get(
                          "pace_connected_count",
                          0
                      ) or 0
                  ),
                  "bloodline records": int(
                      summary.get(
                          "bloodline_connected_count",
                          0
                      ) or 0
                  ),
              }

              for (
                  name,
                  count
              ) in record_checks.items():
                  print(
                      f"{name}: {count}/{total}"
                  )

                  if count != total:
                      sys.exit(
                          f"ERROR: {name} incomplete "
                          f"({count}/{total})"
                      )

              ability_known = int(
                  summary.get(
                      "ability_known_count",
                      0
                  ) or 0
              )

              ability_unknown = int(
                  summary.get(
                      "ability_unknown_count",
                      0
                  ) or 0
              )

              ranked_count = int(
                  summary.get(
                      "ranked_count",
                      0
                  ) or 0
              )

              unranked_unknown = int(
                  summary.get(
                      "unranked_unknown_count",
                      0
                  ) or 0
              )

              if (
                  ability_known
                  + ability_unknown
                  != total
              ):
                  sys.exit(
                      "ERROR: ability known/unknown "
                      "count mismatch"
                  )

              if ranked_count != ability_known:
                  sys.exit(
                      "ERROR: ranked count must equal "
                      "known ability count"
                  )

              if (
                  ranked_count
                  + unranked_unknown
                  != total
              ):
                  sys.exit(
                      "ERROR: ranked + unknown count mismatch"
                  )

              actual_known = 0
              actual_unknown = 0

              for horse in ranking:
                  name = str(
                      horse.get(
                          "horse_name",
                          ""
                      )
                  )

                  ability_is_known = bool(
                      horse.get(
                          "ability_known",
                          False
                      )
                  )

                  ability_score = horse.get(
                      "ability_score"
                  )

                  final_score = horse.get(
                      "final_score"
                  )

                  rank = horse.get(
                      "rank"
                  )

                  condition_fit = horse.get(
                      "condition_fit_score"
                  )

                  blood_adj = float(
                      horse.get(
                          "bloodline_adjustment",
                          0
                      ) or 0
                  )

                  if ability_is_known:
                      actual_known += 1

                      if ability_score is None:
                          sys.exit(
                              "ERROR: known horse has "
                              "null ability_score: "
                              + name
                          )

                      if final_score is None:
                          sys.exit(
                              "ERROR: known horse has "
                              "null final_score: "
                              + name
                          )

                      if rank is None:
                          sys.exit(
                              "ERROR: known horse has "
                              "no rank: "
                              + name
                          )

                  else:
                      actual_unknown += 1

                      if ability_score is not None:
                          sys.exit(
                              "ERROR: UNKNOWN horse has "
                              "imputed ability_score: "
                              + name
                          )

                      if final_score is not None:
                          sys.exit(
                              "ERROR: UNKNOWN horse has "
                              "final_score: "
                              + name
                          )

                      if rank is not None:
                          sys.exit(
                              "ERROR: UNKNOWN horse is ranked: "
                              + name
                          )

                  if (
                      condition_fit is None
                      and abs(
                          blood_adj
                      ) > 1e-9
                  ):
                      sys.exit(
                          "ERROR: bloodline adjustment applied "
                          "without known condition fit: "
                          + name
                          + f" ({blood_adj})"
                      )

              if actual_known != ability_known:
                  sys.exit(
                      "ERROR: actual known count mismatch"
                  )

              if actual_unknown != ability_unknown:
                  sys.exit(
                      "ERROR: actual unknown count mismatch"
                  )

              print()
              print(
                  "===== NORMAL VALIDATION OK ====="
              )

              print(
                  "Ability known:",
                  f"{ability_known}/{total}"
              )

              print(
                  "Ability unknown:",
                  f"{ability_unknown}/{total}"
              )

              print(
                  "Ranked:",
                  f"{ranked_count}/{total}"
              )

              print(
                  "Training:",
                  "DISABLED"
              )

              print(
                  "Bloodline standalone adjustment:",
                  "PROHIBITED"
              )

          # ==================================================
          # 共通リーク安全性
          # ==================================================

          day_bias = data.get(
              "day_bias",
              {}
          )

          if (
              day_bias.get(
                  "source_available"
              )
              and not day_bias.get(
                  "future_safe"
              )
          ):
              sys.exit(
                  "ERROR: day bias future safety failed"
              )

          time_fit = data.get(
              "runner_time_fit",
              {}
          )

          if (
              time_fit.get(
                  "source_available"
              )
              and not time_fit.get(
                  "future_safe"
              )
          ):
              sys.exit(
                  "ERROR: runner time fit "
                  "future safety failed"
              )

          if (
              time_fit.get(
                  "source_available"
              )
              and not time_fit.get(
                  "leak_check_passed"
              )
          ):
              sys.exit(
                  "ERROR: runner time fit "
                  "leak check failed"
              )

          # ==================================================
          # 必須生成・利用ファイル
          # ==================================================

          required_files = [
              "race.json",
              "history_db.json",
              "condition_history.json",
              "day_races.json",
              "day_time_history.json",
              "track_condition.json",
              "day_bias.json",
              "runner_history.json",
              "runner_race_db.json",
              "runner_time_fit.json",
              "runner_analysis.json",
              "previous_race_analysis.json",
              "pace_analysis.json",
              "race_bloodline_score.json",
              "final_analysis.json",
          ]

          for path in required_files:
              if not os.path.exists(
                  path
              ):
                  sys.exit(
                      "ERROR: required file missing: "
                      + path
                  )

          print()
          print(
              "===== VALIDATION OK ====="
          )
          PY

      # ==================================================
      # 結果保存
      # ==================================================

      - name: Commit generated analysis files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          GENERATED_FILES=(
            "race.json"
            "condition_history.json"
            "day_races.json"
            "day_time_history.json"
            "track_condition.json"
            "day_bias.json"
            "pedigree.json"
            "normalized_pedigree.json"
            "history_pedigree.json"
            "runner_history.json"
            "runner_race_db.json"
            "runner_time_fit.json"
            "runner_analysis.json"
            "previous_race_analysis.json"
            "pace_analysis.json"
            "bloodline_stats.json"
            "race_bloodline_score.json"
            "final_analysis.json"
          )

          ADDED_COUNT=0

          for path in "${GENERATED_FILES[@]}"; do
            if [ -f "$path" ]; then
              echo "ADD: $path"
              git add -- "$path"
              ADDED_COUNT=$((ADDED_COUNT + 1))
            else
              echo "SKIP (not generated): $path"
            fi
          done

          echo "Existing generated files: $ADDED_COUNT"

          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi

          git commit -m "Update full race analysis ${RACE_ID}"
          git push
