name: Race Full Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: race-full-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      # ==================================================
      # 今回レース
      # ==================================================

      - name: Load race ID
        run: |
          RACE_ID="$(tr -d '[:space:]' < race_id.txt)"

          if ! [[ "$RACE_ID" =~ ^[0-9]{12}$ ]]; then
            echo "ERROR: race_id.txt must contain exactly 12 digits"
            exit 1
          fi

          echo "RACE_ID=$RACE_ID" >> "$GITHUB_ENV"
          echo "Target race: $RACE_ID"

      - name: Collect race
        run: python main_v3.py

      # ==================================================
      # 過去同条件レース
      # ==================================================

      - name: Find condition history races
        run: python history_batch.py

      - name: Collect condition history results
        run: python history_collect.py

      - name: Update history database
        run: python history_db.py

      - name: Build condition history
        run: python condition_history.py

      # ==================================================
      # 当日データ
      # ==================================================

      - name: Collect day races
        run: python day_races.py

      # 当日の同一馬場レースについて
      # 距離・クラス・年齢条件別の過去基準時計を作る
      - name: Build day time history
        run: python day_time_history.py

      - name: Collect track condition
        run: python track_condition.py

      - name: Analyze day bias
        run: python day_bias.py

      # ==================================================
      # 血統
      # ==================================================

      - name: Collect pedigree
        run: python pedigree.py

      - name: Normalize pedigree
        run: python normalize_pedigree.py

      - name: Collect history pedigree
        run: python history_pedigree.py

      # ==================================================
      # 今回出走馬の過去成績
      # ==================================================

      - name: Collect runner history
        run: python runner_history.py

      # ==================================================
      # 個別解析
      # ==================================================

      - name: Analyze runners
        run: python runner_analysis.py

      - name: Analyze previous race
        run: python previous_race_analysis.py

      - name: Analyze pace
        run: python pace_analysis.py

      # ==================================================
      # 血統統計
      # ==================================================

      - name: Build bloodline statistics
        run: python bloodline_stats.py

      - name: Score race bloodlines
        run: python race_bloodline_score.py

      # ==================================================
      # 最終統合
      # ==================================================

      - name: Run final analysis
        run: python final_analysis.py

      # ==================================================
      # 接続チェック
      # ==================================================

      - name: Validate final analysis
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          with open("final_analysis.json", encoding="utf-8") as f:
              data = json.load(f)

          s = data.get("summary", {})

          total = s.get("runner_count", 0)

          checks = {
              "ranked": s.get("ranked_count", 0),
              "ability": s.get("ability_connected_count", 0),
              "previous": s.get("previous_connected_count", 0),
              "pace": s.get("pace_connected_count", 0),
              "bloodline": s.get("bloodline_connected_count", 0),
          }

          print("Target race:", os.environ.get("RACE_ID"))
          print("Runners:", total)

          if total <= 0:
              sys.exit("ERROR: no runners")

          for name, value in checks.items():
              print(f"{name}: {value}/{total}")

              if value != total:
                  sys.exit(
                      f"ERROR: {name} incomplete "
                      f"({value}/{total})"
                  )

          # ----------------------------------------------
          # 履歴系接続確認
          # ----------------------------------------------

          required_files = [
              "history_races.json",
              "history_all.json",
              "history_db.json",
              "condition_history.json",
              "day_races.json",
              "day_time_history.json",
              "track_condition.json",
              "day_bias.json",
          ]

          for path in required_files:
              if not os.path.exists(path):
                  sys.exit(
                      f"ERROR: required file missing: {path}"
                  )

              print("OK:", path)

          # ----------------------------------------------
          # history_races metadata確認
          # ----------------------------------------------

          with open(
              "history_races.json",
              encoding="utf-8"
          ) as f:
              history_races = json.load(f)

          races = history_races.get(
              "races",
              []
          )

          if not races:
              sys.exit(
                  "ERROR: history_races.json has no races"
              )

          metadata_count = 0

          for race in races:
              if (
                  race.get("race_name")
                  and race.get("race_info_text")
                  and race.get("race_class")
                  and race.get("age_condition")
              ):
                  metadata_count += 1

          print(
              "History metadata:",
              f"{metadata_count}/{len(races)}"
          )

          if metadata_count == 0:
              sys.exit(
                  "ERROR: history race metadata not collected"
              )

          # ----------------------------------------------
          # 未来レース混入防止
          # ----------------------------------------------

          search = history_races.get(
              "search",
              {}
          )

          if search.get(
              "future_races_excluded"
          ) is not True:
              sys.exit(
                  "ERROR: future race exclusion not confirmed"
              )

          if search.get(
              "target_race_excluded"
          ) is not True:
              sys.exit(
                  "ERROR: target race exclusion not confirmed"
              )

          # ----------------------------------------------
          # day_time_history 接続確認
          # ----------------------------------------------

          with open(
              "day_time_history.json",
              encoding="utf-8"
          ) as f:
              day_time = json.load(f)

          if (
              day_time.get("target_race_id")
              != os.environ.get("RACE_ID")
          ):
              sys.exit(
                  "ERROR: day_time_history race_id mismatch"
              )

          if (
              day_time.get("future_race_usage")
              is not False
          ):
              sys.exit(
                  "ERROR: future race used in day_time_history"
              )

          print(
              "Day time references:",
              day_time.get(
                  "reference_race_count",
                  0
              )
          )

          print(
              "Day time baselines:",
              day_time.get(
                  "baseline_connected_count",
                  0
              )
          )

          print("FULL ANALYSIS VALIDATION OK")
          PY

      # ==================================================
      # 全結果保存
      # ==================================================

      - name: Save analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            race.json \
            history_races.json \
            history_all.json \
            history_db.json \
            condition_history.json \
            history_pedigree.json \
            day_races.json \
            day_time_history.json \
            track_condition.json \
            day_bias.json \
            pedigree.json \
            runner_history.json \
            runner_analysis.json \
            previous_race_analysis.json \
            pace_analysis.json \
            bloodline_stats.json \
            race_bloodline_score.json \
            final_analysis.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Full analysis ${RACE_ID}"
            git push
          fi
