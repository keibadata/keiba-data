name: Race Full Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: race-full-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      # ==================================================
      # 今回レース
      # ==================================================

      - name: Load race ID
        run: |
          RACE_ID="$(tr -d '[:space:]' < race_id.txt)"

          if ! [[ "$RACE_ID" =~ ^[0-9]{12}$ ]]; then
            echo "ERROR: race_id.txt must contain exactly 12 digits"
            exit 1
          fi

          echo "RACE_ID=$RACE_ID" >> "$GITHUB_ENV"
          echo "Target race: $RACE_ID"

      - name: Collect race
        run: python main_v3.py

      # ==================================================
      # 過去同条件レース
      # ==================================================

      - name: Find condition history races
        run: python history_batch.py

      - name: Collect condition history results
        run: python history_collect.py

      - name: Update history database
        run: python history_db.py

      - name: Build condition history
        run: python condition_history.py

      # ==================================================
      # 当日データ
      # ==================================================

      - name: Collect day races
        run: python day_races.py

      - name: Build day time history
        run: python day_time_history.py

      - name: Collect track condition
        run: python track_condition.py

      - name: Analyze day bias
        run: python day_bias.py

      # ==================================================
      # 血統
      # ==================================================

      - name: Collect pedigree
        run: python pedigree.py

      - name: Normalize pedigree
        run: python normalize_pedigree.py

      - name: Collect history pedigree
        run: python history_pedigree.py

      # ==================================================
      # 今回出走馬の過去成績
      # ==================================================

      - name: Collect runner history
        run: python runner_history.py

      - name: Analyze runner time fit
        run: python runner_time_fit.py

      # ==================================================
      # 個別解析
      # ==================================================

      - name: Analyze runners
        run: python runner_analysis.py

      - name: Analyze previous race
        run: python previous_race_analysis.py

      - name: Analyze pace
        run: python pace_analysis.py

      # ==================================================
      # 血統統計
      # ==================================================

      - name: Build bloodline statistics
        run: python bloodline_stats.py

      - name: Score race bloodlines
        run: python race_bloodline_score.py

      # ==================================================
      # 最終統合
      # ==================================================

      - name: Run final analysis
        run: python final_analysis.py

      # ==================================================
      # 接続・安全性チェック
      # ==================================================

      - name: Validate final analysis
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          race_id = os.environ.get("RACE_ID")

          with open(
              "final_analysis.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if data.get("race_id") != race_id:
              sys.exit(
                  "ERROR: final_analysis race_id mismatch"
              )

          s = data.get(
              "summary",
              {}
          )

          total = int(
              s.get(
                  "runner_count",
                  0
              )
              or 0
          )

          if total <= 0:
              sys.exit(
                  "ERROR: no runners"
              )

          print(
              "Target race:",
              race_id
          )

          print(
              "Runners:",
              total
          )

          # ==============================================
          # 各解析ファイルの「レコード接続」を確認
          #
          # ability_known_count は能力判明頭数なので
          # 全頭一致を要求しない。
          # ==============================================

          ability_records = int(
              s.get(
                  "ability_record_connected_count",
                  0
              )
              or 0
          )

          previous_connected = int(
              s.get(
                  "previous_connected_count",
                  0
              )
              or 0
          )

          pace_connected = int(
              s.get(
                  "pace_connected_count",
                  0
              )
              or 0
          )

          bloodline_connected = int(
              s.get(
                  "bloodline_connected_count",
                  0
              )
              or 0
          )

          record_checks = {
              "ability records":
                  ability_records,

              "previous records":
                  previous_connected,

              "pace records":
                  pace_connected,

              "bloodline records":
                  bloodline_connected,
          }

          for name, value in record_checks.items():
              print(
                  f"{name}: {value}/{total}"
              )

              if value != total:
                  sys.exit(
                      f"ERROR: {name} incomplete "
                      f"({value}/{total})"
                  )

          # ==============================================
          # 能力判明 / UNKNOWN
          #
          # UNKNOWNは正常な状態。
          # ranked_count == total を要求しない。
          # ==============================================

          ability_known = int(
              s.get(
                  "ability_known_count",
                  0
              )
              or 0
          )

          ability_unknown = int(
              s.get(
                  "ability_unknown_count",
                  0
              )
              or 0
          )

          ranked = int(
              s.get(
                  "ranked_count",
                  0
              )
              or 0
          )

          unranked_unknown = int(
              s.get(
                  "unranked_unknown_count",
                  0
              )
              or 0
          )

          print(
              "Ability known:",
              f"{ability_known}/{total}"
          )

          print(
              "Ability unknown:",
              f"{ability_unknown}/{total}"
          )

          print(
              "Ranked:",
              f"{ranked}/{total}"
          )

          print(
              "Unranked unknown:",
              f"{unranked_unknown}/{total}"
          )

          if (
              ability_known
              + ability_unknown
              != total
          ):
              sys.exit(
                  "ERROR: ability known/unknown count mismatch "
                  f"({ability_known}+{ability_unknown}!={total})"
              )

          if ranked != ability_known:
              sys.exit(
                  "ERROR: ranked count must equal "
                  "known ability count "
                  f"({ranked}!={ability_known})"
              )

          if (
              ranked
              + unranked_unknown
              != total
          ):
              sys.exit(
                  "ERROR: ranked + unknown count mismatch "
                  f"({ranked}+{unranked_unknown}!={total})"
              )

          # ==============================================
          # ranking配列そのものも確認
          # ==============================================

          ranking = data.get(
              "ranking",
              []
          )

          if len(ranking) != total:
              sys.exit(
                  "ERROR: ranking record count mismatch "
                  f"({len(ranking)}/{total})"
              )

          actual_ranked = 0
          actual_unknown = 0

          for horse in ranking:
              ability_is_known = bool(
                  horse.get(
                      "ability_known",
                      False
                  )
              )

              rank = horse.get(
                  "rank"
              )

              final_score = horse.get(
                  "final_score"
              )

              ability_score = horse.get(
                  "ability_score"
              )

              if ability_is_known:
                  actual_ranked += 1

                  if rank is None:
                      sys.exit(
                          "ERROR: known ability horse "
                          "has no rank: "
                          + str(
                              horse.get(
                                  "horse_name",
                                  ""
                              )
                          )
                      )

                  if final_score is None:
                      sys.exit(
                          "ERROR: known ability horse "
                          "has no final_score: "
                          + str(
                              horse.get(
                                  "horse_name",
                                  ""
                              )
                          )
                      )

                  if ability_score is None:
                      sys.exit(
                          "ERROR: ability_known horse "
                          "has null ability_score: "
                          + str(
                              horse.get(
                                  "horse_name",
                                  ""
                              )
                          )
                      )

              else:
                  actual_unknown += 1

                  if rank is not None:
                      sys.exit(
                          "ERROR: unknown ability horse "
                          "must not be ranked: "
                          + str(
                              horse.get(
                                  "horse_name",
                                  ""
                              )
                          )
                      )

                  if final_score is not None:
                      sys.exit(
                          "ERROR: unknown ability horse "
                          "must not have final_score: "
                          + str(
                              horse.get(
                                  "horse_name",
                                  ""
                              )
                          )
                      )

                  if ability_score is not None:
                      sys.exit(
                          "ERROR: unknown ability horse "
                          "must not have imputed ability_score: "
                          + str(
                              horse.get(
                                  "horse_name",
                                  ""
                              )
                          )
                      )

          if actual_ranked != ranked:
              sys.exit(
                  "ERROR: actual ranked count mismatch "
                  f"({actual_ranked}/{ranked})"
              )

          if actual_unknown != unranked_unknown:
              sys.exit(
                  "ERROR: actual unknown count mismatch "
                  f"({actual_unknown}/{unranked_unknown})"
              )

          # ==============================================
          # 必須ファイル
          # ==============================================

          required_files = [
              "history_races.json",
              "history_all.json",
              "history_db.json",
              "condition_history.json",
              "day_races.json",
              "day_time_history.json",
              "track_condition.json",
              "day_bias.json",
              "runner_history.json",
              "runner_time_fit.json",
          ]

          for path in required_files:
              if not os.path.exists(path):
                  sys.exit(
                      "ERROR: required file missing: "
                      + path
                  )

              print(
                  "OK:",
                  path
              )

          # ==============================================
          # history_races metadata
          # ==============================================

          with open(
              "history_races.json",
              encoding="utf-8"
          ) as f:
              history_races = json.load(f)

          races = history_races.get(
              "races",
              []
          )

          if not races:
              sys.exit(
                  "ERROR: history_races.json has no races"
              )

          metadata_count = 0

          for race in races:
              if (
                  race.get("race_name")
                  and race.get("race_info_text")
                  and race.get("race_class")
                  and race.get("age_condition")
              ):
                  metadata_count += 1

          print(
              "History metadata:",
              f"{metadata_count}/{len(races)}"
          )

          if metadata_count == 0:
              sys.exit(
                  "ERROR: history race metadata not collected"
              )

          # ==============================================
          # history未来レース混入防止
          # ==============================================

          search = history_races.get(
              "search",
              {}
          )

          if search.get(
              "future_races_excluded"
          ) is not True:
              sys.exit(
                  "ERROR: future race exclusion not confirmed"
              )

          if search.get(
              "target_race_excluded"
          ) is not True:
              sys.exit(
                  "ERROR: target race exclusion not confirmed"
              )

          # ==============================================
          # day_time_history
          # ==============================================

          with open(
              "day_time_history.json",
              encoding="utf-8"
          ) as f:
              day_time = json.load(f)

          if (
              day_time.get(
                  "target_race_id"
              )
              != race_id
          ):
              sys.exit(
                  "ERROR: day_time_history race_id mismatch"
              )

          if (
              day_time.get(
                  "future_race_usage"
              )
              is not False
          ):
              sys.exit(
                  "ERROR: future race used in day_time_history"
              )

          if (
              day_time.get(
                  "leak_check_passed"
              )
              is not True
          ):
              sys.exit(
                  "ERROR: day_time_history leak check failed"
              )

          print(
              "Day time references:",
              day_time.get(
                  "reference_race_count",
                  0
              )
          )

          print(
              "Day time baselines:",
              day_time.get(
                  "baseline_connected_count",
                  0
              )
          )

          # ==============================================
          # day_bias
          # ==============================================

          with open(
              "day_bias.json",
              encoding="utf-8"
          ) as f:
              day_bias = json.load(f)

          if (
              day_bias.get("race_id")
              != race_id
          ):
              sys.exit(
                  "ERROR: day_bias race_id mismatch"
              )

          if (
              day_bias.get(
                  "future_race_usage"
              )
              is not False
          ):
              sys.exit(
                  "ERROR: future race used in day_bias"
              )

          print(
              "Day bias time connected:",
              day_bias.get(
                  "time_bias_connected"
              )
          )

          print(
              "Day bias time:",
              day_bias.get(
                  "time_bias",
                  ""
              )
          )

          print(
              "Day bias time score:",
              day_bias.get(
                  "time_bias_score"
              )
          )

          # ==============================================
          # runner_time_fit
          # ==============================================

          with open(
              "runner_time_fit.json",
              encoding="utf-8"
          ) as f:
              runner_time = json.load(f)

          if (
              runner_time.get(
                  "target_race_id"
              )
              != race_id
          ):
              sys.exit(
                  "ERROR: runner_time_fit race_id mismatch"
              )

          if (
              runner_time.get(
                  "future_race_usage"
              )
              is not False
          ):
              sys.exit(
                  "ERROR: future race used in runner_time_fit"
              )

          if (
              runner_time.get(
                  "leak_check_passed"
              )
              is not True
          ):
              sys.exit(
                  "ERROR: runner_time_fit leak check failed"
              )

          target_horses = int(
              runner_time.get(
                  "target_horse_count",
                  0
              )
              or 0
          )

          connected_horses = int(
              runner_time.get(
                  "connected_horse_count",
                  0
              )
              or 0
          )

          connected_past_races = int(
              runner_time.get(
                  "connected_past_race_count",
                  0
              )
              or 0
          )

          baseline_conditions = int(
              runner_time.get(
                  "baseline_condition_count",
                  0
              )
              or 0
          )

          print(
              "Runner time horses:",
              f"{connected_horses}/{target_horses}"
          )

          print(
              "Runner time connected past races:",
              connected_past_races
          )

          print(
              "Runner time baseline conditions:",
              baseline_conditions
          )

          if target_horses != total:
              sys.exit(
                  "ERROR: runner_time_fit horse count mismatch "
                  f"({target_horses}/{total})"
              )

          # ==============================================
          # 最終
          # ==============================================

          if ability_known == 0:
              print(
                  "No known ability data: "
                  "all horses remain UNKNOWN and unranked."
              )

          print(
              "FULL ANALYSIS VALIDATION OK"
          )
          PY

      # ==================================================
      # 全結果保存
      # ==================================================

      - name: Save analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            race.json \
            history_races.json \
            history_all.json \
            history_db.json \
            condition_history.json \
            history_pedigree.json \
            day_races.json \
            day_time_history.json \
            track_condition.json \
            day_bias.json \
            pedigree.json \
            runner_history.json \
            runner_time_fit.json \
            runner_analysis.json \
            previous_race_analysis.json \
            pace_analysis.json \
            bloodline_stats.json \
            race_bloodline_score.json \
            final_analysis.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Full analysis ${RACE_ID}"
            git push
          fi
