name: Race Full Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: race-full-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      # ==================================================
      # 今回レース
      # ==================================================

      - name: Load race ID
        run: |
          RACE_ID="$(tr -d '[:space:]' < race_id.txt)"

          if ! [[ "$RACE_ID" =~ ^[0-9]{12}$ ]]; then
            echo "ERROR: race_id.txt must contain exactly 12 digits"
            exit 1
          fi

          echo "RACE_ID=$RACE_ID" >> "$GITHUB_ENV"
          echo "Target race: $RACE_ID"

      - name: Collect race
        run: python main_v3.py

      # ==================================================
      # 過去DB
      #
      # history_db.json は既存キャッシュを使用
      # Full Analysisでは再収集しない
      # ==================================================

      - name: Validate cached history database
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          path = "history_db.json"

          if not os.path.exists(path):
              sys.exit("ERROR: history_db.json is missing")

          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              sys.exit(
                  "ERROR: history_db.json cannot be loaded: "
                  + str(exc)
              )

          if isinstance(data, dict):
              races = data.get("races", [])
          elif isinstance(data, list):
              races = data
          else:
              races = []

          if not isinstance(races, list) or not races:
              sys.exit("ERROR: history_db.json has no race data")

          print(
              "Cached history database OK:",
              len(races),
              "races"
          )
          PY

      - name: Build condition history
        run: python condition_history.py

      # ==================================================
      # 当日データ
      # ==================================================

      - name: Collect day races
        run: python day_races.py

      - name: Build day time history
        run: python day_time_history.py

      - name: Collect track condition
        run: python track_condition.py

      - name: Analyze day bias
        run: python day_bias.py

      # ==================================================
      # 血統
      # ==================================================

      - name: Collect pedigree
        run: python pedigree.py

      - name: Normalize pedigree
        run: python normalize_pedigree.py

      - name: Collect history pedigree
        run: python history_pedigree.py

      # ==================================================
      # 出走馬過去成績
      # ==================================================

      - name: Collect runner history
        run: python runner_history.py

      - name: Collect runner race database
        run: python runner_race_db.py

      - name: Analyze runner time fit
        run: python runner_time_fit.py

      # ==================================================
      # 個別解析
      #
      # 調教は使用しない
      # ==================================================

      - name: Analyze runners
        run: python runner_analysis.py

      - name: Analyze previous race
        run: python previous_race_analysis.py

      - name: Analyze pace
        run: python pace_analysis.py

      # ==================================================
      # 血統統計
      # ==================================================

      - name: Build bloodline statistics
        run: python bloodline_stats.py

      - name: Score race bloodlines
        run: python race_bloodline_score.py

      # ==================================================
      # 最終統合
      #
      # 1. 通常解析を実行
      # 2. 新馬戦なら血統専用解析で上書き
      #    通常戦では newcomer_final_analysis.py はSKIP
      # ==================================================

      - name: Run final analysis
        run: python final_analysis.py

      - name: Apply newcomer pedigree-only analysis
        run: python newcomer_final_analysis.py

      # ==================================================
      # 最終安全チェック + 発走前予想保存
      #
      # production_snapshot_hook.py が以下を一括実行
      #
      # 1. 最終解析内容を検証
      # 2. race_id / 頭数を検証
      # 3. 通常戦ルールを検証
      # 4. 新馬戦の血統専用ルールを検証
      # 5. day_bias の未来情報リークを検証
      # 6. runner_time_fit の未来情報リークを検証
      # 7. prediction_snapshot.py を実行
      # 8. 保存された snapshot を再検証
      # ==================================================

      - name: Validate final analysis and save prediction snapshot
        run: python production_snapshot_hook.py

      # ==================================================
      # 結果保存
      # ==================================================

      - name: Commit generated analysis files and prediction snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          GENERATED_FILES=(
            "race.json"
            "condition_history.json"
            "day_races.json"
            "day_time_history.json"
            "track_condition.json"
            "day_bias.json"
            "pedigree.json"
            "normalized_pedigree.json"
            "history_pedigree.json"
            "runner_history.json"
            "runner_race_db.json"
            "runner_time_fit.json"
            "runner_analysis.json"
            "previous_race_analysis.json"
            "pace_analysis.json"
            "bloodline_stats.json"
            "race_bloodline_score.json"
            "final_analysis.json"
          )

          ADDED_COUNT=0

          for path in "${GENERATED_FILES[@]}"; do
            if [ -f "$path" ]; then
              echo "ADD: $path"
              git add -- "$path"
              ADDED_COUNT=$((ADDED_COUNT + 1))
            else
              echo "SKIP (not generated): $path"
            fi
          done

          if [ -d "prediction_snapshots" ]; then
            echo "ADD: prediction_snapshots"
            git add -- prediction_snapshots
          else
            echo "ERROR: prediction_snapshots directory was not created"
            exit 1
          fi

          echo "Existing generated files: $ADDED_COUNT"

          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi

          git commit -m "Update full race analysis ${RACE_ID}"
          git push
