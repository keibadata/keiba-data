name: Day Bias Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  day-bias:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      # =====================================
      # 1. 対象レースより前の当日レース収集
      # =====================================

      - name: Collect previous day races
        run: |
          python day_race_collector.py

      # =====================================
      # 2. 収集結果確認
      # =====================================

      - name: Show collected day races
        run: |
          cat day_races.json

      # =====================================
      # 3. 当日バイアス判定
      # =====================================

      - name: Run day bias
        run: |
          python day_bias.py

      # =====================================
      # 4. バイアス結果確認
      # =====================================

      - name: Show day bias
        run: |
          cat day_bias.json

      # =====================================
      # 5. 安全性チェック
      # =====================================

      - name: Validate day bias
        run: |
          python - <<'PY'
          import json
          import sys

          with open("race.json", "r", encoding="utf-8") as f:
              race = json.load(f)

          with open("day_races.json", "r", encoding="utf-8") as f:
              day_races = json.load(f)

          with open("day_bias.json", "r", encoding="utf-8") as f:
              day_bias = json.load(f)

          race_id = str(race.get("race_id", "")).strip()

          if len(race_id) != 12 or not race_id.isdigit():
              sys.exit("ERROR: invalid race_id")

          target_race_number = int(race_id[-2:])

          collected_target = str(
              day_races.get("target_race_id", "")
          ).strip()

          if collected_target != race_id:
              sys.exit(
                  "ERROR: day_races race ID mismatch"
              )

          if day_races.get("future_race_usage"):
              sys.exit(
                  "ERROR: future race usage detected in day_races"
              )

          for item in day_races.get("races", []):
              race_number = item.get("race_number")

              if race_number is None:
                  continue

              if int(race_number) >= target_race_number:
                  sys.exit(
                      "ERROR: future race mixed into day_races"
                  )

          bias_race_id = str(
              day_bias.get("race_id", "")
          ).strip()

          if bias_race_id != race_id:
              sys.exit(
                  "ERROR: day_bias race ID mismatch"
              )

          if day_bias.get("future_race_usage"):
              sys.exit(
                  "ERROR: future race usage detected in day_bias"
              )

          print("race_id:", race_id)
          print(
              "target race number:",
              target_race_number
          )
          print(
              "eligible previous races:",
              day_races.get(
                  "eligible_previous_race_numbers",
                  []
              )
          )
          print(
              "collected race count:",
              day_races.get(
                  "collected_race_count",
                  0
              )
          )
          print(
              "same surface finished:",
              day_races.get(
                  "same_surface_finished_count",
                  0
              )
          )
          print(
              "day bias reference count:",
              day_bias.get(
                  "reference_race_count",
                  0
              )
          )

          print("DAY BIAS VALIDATION OK")
          PY

      # =====================================
      # 6. 保存
      # =====================================

      - name: Save day bias data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            day_races.json \
            day_bias.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update day race bias"
          git push
