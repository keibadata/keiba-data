name: Day Bias Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  day-bias:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      # ===================================================
      # テスト対象
      # 東京 5R
      # ===================================================

      - name: Prepare test race
        run: |
          echo "202605040505" > race_id.txt

          export RACE_ID="202605040505"

          python main_v3.py

          python - <<'PY'
          import json

          expected = "202605040505"

          with open(
              "race.json",
              "r",
              encoding="utf-8"
          ) as f:
              race = json.load(f)

          actual = str(
              race.get("race_id", "")
          )

          print("requested:", expected)
          print("race.json:", actual)

          if actual != expected:
              raise SystemExit(
                  "ERROR: collected race_id mismatch"
              )

          print(
              "TEST RACE OK:",
              actual
          )
          PY

      # ===================================================
      # 対象5R用の馬場データを作成
      # ===================================================

      - name: Build track condition
        run: |
          python track_condition.py

          python - <<'PY'
          import json

          with open(
              "race.json",
              "r",
              encoding="utf-8"
          ) as f:
              race = json.load(f)

          with open(
              "track_condition.json",
              "r",
              encoding="utf-8"
          ) as f:
              track = json.load(f)

          race_id = str(
              race.get("race_id", "")
          )

          track_race_id = str(
              track.get("race_id", "")
          )

          print(
              "race.json race_id:",
              race_id
          )

          print(
              "track_condition race_id:",
              track_race_id
          )

          if race_id != track_race_id:
              raise SystemExit(
                  "ERROR: track_condition race_id mismatch"
              )

          print(
              "TRACK CONDITION OK"
          )
          PY

      # ===================================================
      # 5Rより前の同日レースだけ収集
      # ===================================================

      - name: Collect previous day races
        run: |
          python day_races.py

      - name: Show collected day races
        run: |
          echo "===== day_races.json ====="
          cat day_races.json

      # ===================================================
      # 当日バイアス
      # ===================================================

      - name: Run day bias
        run: |
          python day_bias.py

      - name: Show day bias
        run: |
          echo "===== day_bias.json ====="
          cat day_bias.json

      # ===================================================
      # 未来レース混入チェック
      # ===================================================

      - name: Validate day bias
        run: |
          python - <<'PY'
          import json

          with open(
              "race.json",
              "r",
              encoding="utf-8"
          ) as f:
              race = json.load(f)

          with open(
              "day_bias.json",
              "r",
              encoding="utf-8"
          ) as f:
              bias = json.load(f)

          expected_race_id = str(
              race.get("race_id", "")
          )

          actual_race_id = str(
              bias.get("race_id", "")
          )

          print(
              "race.json:",
              expected_race_id
          )

          print(
              "day_bias.json:",
              actual_race_id
          )

          if (
              expected_race_id
              != actual_race_id
          ):
              raise SystemExit(
                  "ERROR: day_bias race_id mismatch"
              )

          race_number = int(
              bias.get(
                  "race_number",
                  0
              )
              or 0
          )

          previous_numbers = (
              bias.get(
                  "eligible_previous_race_numbers",
                  []
              )
              or []
          )

          print(
              "target race number:",
              race_number
          )

          print(
              "eligible previous races:",
              previous_numbers
          )

          for number in previous_numbers:

              if int(number) >= race_number:

                  raise SystemExit(
                      "ERROR: future race leakage detected"
                  )

          if bias.get(
              "future_race_usage",
              False
          ):
              raise SystemExit(
                  "ERROR: future_race_usage = true"
              )

          print(
              "NO FUTURE RACE LEAKAGE"
          )

          print(
              "DAY BIAS VALIDATION OK"
          )
          PY

      # ===================================================
      # 保存
      # ===================================================

      - name: Save day bias test data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            race_id.txt \
            race.json \
            track_condition.json \
            day_races.json \
            day_bias.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Test day bias with previous races"
          git push
