name: Day Bias Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  day-bias:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run day bias
        run: |
          python day_bias.py

      - name: Show day bias
        run: |
          cat day_bias.json

      - name: Save day bias
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add day_bias.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update day bias"
          git push
