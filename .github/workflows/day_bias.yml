name: Day Bias Test

on:
  workflow_dispatch:
    inputs:
      test_race_id:
        description: "テスト対象Race ID（12桁）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  day-bias:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      # =====================================
      # テスト対象race.jsonを取得
      # race_id.txt本体は変更しない
      # =====================================

      - name: Prepare test race
        env:
          TEST_RACE_ID: ${{ inputs.test_race_id }}
        run: |
          if ! echo "$TEST_RACE_ID" | grep -Eq '^[0-9]{12}$'; then
            echo "ERROR: test_race_id must contain exactly 12 digits"
            exit 1
          fi

          echo "Test Race ID: $TEST_RACE_ID"

          cp race_id.txt race_id_backup.txt
          printf '%s\n' "$TEST_RACE_ID" > race_id.txt

          python main_v3.py

          mv race_id_backup.txt race_id.txt

          python - <<'PY'
          import json
          import os

          target = os.environ.get("TEST_RACE_ID", "").strip()

          with open("race.json", "r", encoding="utf-8") as f:
              race = json.load(f)

          actual = str(race.get("race_id", "")).strip()

          print("requested:", target)
          print("race.json:", actual)

          if actual != target:
              raise SystemExit(
                  "ERROR: collected race_id mismatch"
              )

          print("TEST RACE PREPARED")
          PY

      # =====================================
      # 対象レース以前だけ収集
      # =====================================

      - name: Collect previous day races
        run: |
          python day_race_collector.py

      - name: Show collected day races
        run: |
          cat day_races.json

      # =====================================
      # 当日バイアス
      # =====================================

      - name: Run day bias
        run: |
          python day_bias.py

      - name: Show day bias
        run: |
          cat day_bias.json

      # =====================================
      # 未来レース混入チェック
      # =====================================

      - name: Validate day bias
        run: |
          python - <<'PY'
          import json
          import sys

          with open("race.json", "r", encoding="utf-8") as f:
              race = json.load(f)

          with open("day_races.json", "r", encoding="utf-8") as f:
              day_races = json.load(f)

          with open("day_bias.json", "r", encoding="utf-8") as f:
              day_bias = json.load(f)

          race_id = str(
              race.get("race_id", "")
          ).strip()

          if len(race_id) != 12 or not race_id.isdigit():
              sys.exit("ERROR: invalid race_id")

          target_number = int(
              race_id[-2:]
          )

          print("target race:", target_number)

          expected = list(
              range(1, target_number)
          )

          actual_eligible = day_races.get(
              "eligible_previous_race_numbers",
              []
          )

          print(
              "expected eligible:",
              expected
          )

          print(
              "actual eligible:",
              actual_eligible
          )

          if actual_eligible != expected:
              sys.exit(
                  "ERROR: eligible race numbers mismatch"
              )

          if day_races.get(
              "future_race_usage"
          ):
              sys.exit(
                  "ERROR: future race usage detected"
              )

          for item in day_races.get(
              "races",
              []
          ):
              number = item.get(
                  "race_number"
              )

              if number is None:
                  continue

              if int(number) >= target_number:
                  sys.exit(
                      "ERROR: future race mixed into collection"
                  )

          if day_bias.get(
              "future_race_usage"
          ):
              sys.exit(
                  "ERROR: future race usage detected in bias"
              )

          print(
              "collected:",
              day_races.get(
                  "collected_race_count",
                  0
              )
          )

          print(
              "same surface finished:",
              day_races.get(
                  "same_surface_finished_count",
                  0
              )
          )

          print(
              "reference count:",
              day_bias.get(
                  "reference_race_count",
                  0
              )
          )

          print(
              "FUTURE LEAK CHECK OK"
          )
          PY

      # =====================================
      # テスト結果だけ保存
      # race.json / race_id.txt は保存しない
      # =====================================

      - name: Save day bias test data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            day_races.json \
            day_bias.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Test day race bias"
          git push
