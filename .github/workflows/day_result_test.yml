name: Day Result Collector Test

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: "12-digit Race ID"
        required: true
        default: "202608040912"

permissions:
  contents: read

jobs:
  test-day-result-collector:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Validate Race ID
        shell: bash
        run: |
          RACE_ID="${{ github.event.inputs.race_id }}"

          if [[ ! "$RACE_ID" =~ ^[0-9]{12}$ ]]; then
            echo "ERROR: Race ID must be exactly 12 digits."
            exit 1
          fi

          echo "Race ID: $RACE_ID"

      - name: Create test race.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          race_id = "${{ github.event.inputs.race_id }}"

          track_codes = {
              "01": "札幌",
              "02": "函館",
              "03": "福島",
              "04": "新潟",
              "05": "東京",
              "06": "中山",
              "07": "中京",
              "08": "京都",
              "09": "阪神",
              "10": "小倉",
          }

          track_code = race_id[4:6]
          race_number = int(race_id[10:12])

          race = {
              "race_id": race_id,
              "race_date": "2026-10-25",
              "racecourse": track_codes.get(track_code, ""),
              "track": track_codes.get(track_code, ""),
              "surface": "芝",
              "distance": 1400,
              "race_number": race_number,
          }

          with open(
              "race.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  race,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("Created race.json")
          print(
              json.dumps(
                  race,
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Run day race collector
        run: |
          python day_race_collector.py \
            --include-target \
            --output day_result_test.json

      - name: Show collected target result
        run: |
          python - <<'PY'
          import json

          with open(
              "day_result_test.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          target_number = data.get(
              "target_race_number"
          )

          target = None

          for race in data.get(
              "races",
              []
          ):
              if (
                  race.get("race_number")
                  == target_number
              ):
                  target = race
                  break

          if target is None:
              raise SystemExit(
                  "ERROR: target race was not collected"
              )

          print()
          print(
              "===== TARGET RACE ====="
          )

          print(
              "race_id:",
              target.get("race_id")
          )

          print(
              "race_number:",
              target.get(
                  "race_number"
              )
          )

          print(
              "race_name:",
              target.get(
                  "race_name"
              )
          )

          print(
              "surface:",
              target.get(
                  "surface"
              )
          )

          print(
              "distance:",
              target.get(
                  "distance"
              )
          )

          print(
              "track_condition:",
              target.get(
                  "track_condition"
              )
          )

          print(
              "finished:",
              target.get(
                  "finished"
              )
          )

          print(
              "finisher_count:",
              target.get(
                  "finisher_count"
              )
          )

          print(
              "winner_time:",
              target.get(
                  "winner_time"
              )
          )

          print(
              "winner_last3f:",
              target.get(
                  "winner_last3f"
              )
          )

          print(
              "laps:",
              target.get(
                  "laps"
              )
          )

          print(
              "pace:",
              target.get(
                  "pace"
              )
          )

          print()
          print(
              "===== FINISHERS ====="
          )

          for horse in target.get(
              "finishers",
              []
          ):
              print(
                  horse.get("finish"),
                  horse.get(
                      "horse_number"
                  ),
                  horse.get(
                      "horse_name"
                  ),
                  horse.get(
                      "race_time"
                  ),
                  "last3f=",
                  horse.get(
                      "last3f"
                  ),
                  "pop=",
                  horse.get(
                      "popularity"
                  ),
                  "odds=",
                  horse.get(
                      "odds"
                  ),
                  "body=",
                  horse.get(
                      "body_weight"
                  ),
                  horse.get(
                      "body_weight_change"
                  ),
                  "jockey=",
                  horse.get(
                      "jockey"
                  ),
                  "weight=",
                  horse.get(
                      "carried_weight"
                  ),
              )

          print(
              "======================="
          )
          PY

      - name: Validate collector safety
        run: |
          python - <<'PY'
          import json

          with open(
              "day_result_test.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          if (
              data.get("mode")
              != "result_verification"
          ):
              raise SystemExit(
                  "ERROR: wrong mode"
              )

          if not data.get(
              "include_target"
          ):
              raise SystemExit(
                  "ERROR: include_target is false"
              )

          if data.get(
              "future_race_usage"
          ):
              raise SystemExit(
                  "ERROR: future race data detected"
              )

          if not data.get(
              "target_race_included"
          ):
              raise SystemExit(
                  "ERROR: target race missing"
              )

          target_number = data.get(
              "target_race_number"
          )

          for race in data.get(
              "races",
              []
          ):
              number = race.get(
                  "race_number"
              )

              if (
                  number is not None
                  and number
                  > target_number
              ):
                  raise SystemExit(
                      "ERROR: future race included"
                  )

          print(
              "COLLECTOR SAFETY OK"
          )
          PY

      - name: Validate target race result
        run: |
          python - <<'PY'
          import json

          with open(
              "day_result_test.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          target_number = data.get(
              "target_race_number"
          )

          target = next(
              (
                  race
                  for race in data.get(
                      "races",
                      []
                  )
                  if race.get(
                      "race_number"
                  )
                  == target_number
              ),
              None,
          )

          if target is None:
              raise SystemExit(
                  "ERROR: target race not found"
              )

          if not target.get(
              "finished"
          ):
              raise SystemExit(
                  "ERROR: target race not recognized as finished"
              )

          finishers = target.get(
              "finishers",
              []
          )

          if len(finishers) < 3:
              raise SystemExit(
                  "ERROR: fewer than 3 finishers"
              )

          for index, horse in enumerate(
              finishers,
              start=1,
          ):
              if (
                  horse.get("finish")
                  != index
              ):
                  raise SystemExit(
                      "ERROR: finish order is broken"
                  )

          print(
              "TARGET RESULT BASIC VALIDATION OK"
          )
          PY

      - name: Validate Kyoto 12R known top 3
        if: ${{ github.event.inputs.race_id == '202608040912' }}
        run: |
          python - <<'PY'
          import json

          with open(
              "day_result_test.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          target = next(
              race
              for race in data["races"]
              if race.get(
                  "race_number"
              ) == 12
          )

          finishers = target.get(
              "finishers",
              []
          )

          expected = [
              {
                  "finish": 1,
                  "horse_number": 5,
                  "horse_name":
                      "アンビシャスヨシノ",
              },
              {
                  "finish": 2,
                  "horse_number": 12,
                  "horse_name":
                      "ポッドドンナー",
              },
              {
                  "finish": 3,
                  "horse_number": 7,
                  "horse_name":
                      "ジーベック",
              },
          ]

          for expected_horse in expected:

              finish = expected_horse[
                  "finish"
              ]

              actual = next(
                  (
                      horse
                      for horse
                      in finishers
                      if horse.get(
                          "finish"
                      ) == finish
                  ),
                  None,
              )

              if actual is None:
                  raise SystemExit(
                      f"ERROR: finish {finish} missing"
                  )

              if (
                  actual.get(
                      "horse_number"
                  )
                  != expected_horse[
                      "horse_number"
                  ]
              ):
                  raise SystemExit(
                      "ERROR: "
                      f"{finish}着馬番不一致 "
                      f"expected="
                      f"{expected_horse['horse_number']} "
                      f"actual="
                      f"{actual.get('horse_number')}"
                  )

              if (
                  actual.get(
                      "horse_name"
                  )
                  != expected_horse[
                      "horse_name"
                  ]
              ):
                  raise SystemExit(
                      "ERROR: "
                      f"{finish}着馬名不一致 "
                      f"expected="
                      f"{expected_horse['horse_name']} "
                      f"actual="
                      f"{actual.get('horse_name')}"
                  )

          print(
              "KYOTO 12R TOP3 VALIDATION OK"
          )
          PY

      - name: Validate important analysis fields
        run: |
          python - <<'PY'
          import json

          with open(
              "day_result_test.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          target_number = data.get(
              "target_race_number"
          )

          target = next(
              race
              for race in data["races"]
              if race.get(
                  "race_number"
              ) == target_number
          )

          finishers = target.get(
              "finishers",
              []
          )

          winner = finishers[0]

          checks = {
              "winner horse number":
                  winner.get(
                      "horse_number"
                  ),
              "winner horse name":
                  winner.get(
                      "horse_name"
                  ),
              "winner time":
                  winner.get(
                      "race_time"
                  ),
              "winner last3f":
                  winner.get(
                      "last3f"
                  ),
              "winner popularity":
                  winner.get(
                      "popularity"
                  ),
              "laps":
                  target.get(
                      "laps"
                  ),
          }

          print()
          print(
              "===== FIELD CHECK ====="
          )

          for name, value in (
              checks.items()
          ):
              print(
                  name,
                  "=",
                  value,
              )

          print(
              "======================="
          )

          required = [
              (
                  "horse_number",
                  winner.get(
                      "horse_number"
                  ),
              ),
              (
                  "horse_name",
                  winner.get(
                      "horse_name"
                  ),
              ),
              (
                  "race_time",
                  winner.get(
                      "race_time"
                  ),
              ),
              (
                  "last3f",
                  winner.get(
                      "last3f"
                  ),
              ),
              (
                  "popularity",
                  winner.get(
                      "popularity"
                  ),
              ),
          ]

          missing = [
              name
              for name, value
              in required
              if value in (
                  None,
                  "",
              )
          ]

          if missing:
              raise SystemExit(
                  "ERROR: missing fields: "
                  + ", ".join(
                      missing
                  )
              )

          laps = target.get(
              "laps",
              []
          )

          if len(laps) < 6:
              raise SystemExit(
                  "ERROR: lap data missing"
              )

          print(
              "IMPORTANT FIELD VALIDATION OK"
          )
          PY

      - name: Upload collector result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day-result-collector-test
          path: day_result_test.json
          if-no-files-found: warn
          retention-days: 7
