name: Day Result Collector Test

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: "12-digit Race ID"
        required: true
        default: "202608040912"

permissions:
  contents: read

jobs:
  inspect-netkeiba-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Validate Race ID
        shell: bash
        run: |
          RACE_ID="${{ github.event.inputs.race_id }}"

          if [[ ! "$RACE_ID" =~ ^[0-9]{12}$ ]]; then
            echo "ERROR: Race ID must be exactly 12 digits."
            exit 1
          fi

          echo "Race ID: $RACE_ID"

      - name: Fetch and inspect netkeiba HTML
        shell: bash
        run: |
          RACE_ID="${{ github.event.inputs.race_id }}"

          python - "$RACE_ID" <<'PY'
          import json
          import re
          import sys

          import requests
          from bs4 import BeautifulSoup


          race_id = sys.argv[1]

          url = (
              "https://race.netkeiba.com/"
              "race/result.html"
              f"?race_id={race_id}"
          )

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                  "AppleWebKit/605.1.15 "
                  "(KHTML, like Gecko) "
                  "Version/18.0 "
                  "Mobile/15E148 Safari/604.1"
              ),
              "Accept": (
                  "text/html,"
                  "application/xhtml+xml,"
                  "application/xml;q=0.9,"
                  "*/*;q=0.8"
              ),
              "Accept-Language": "ja,en-US;q=0.8,en;q=0.6",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
          }

          response = requests.get(
              url,
              headers=headers,
              timeout=30,
              allow_redirects=True,
          )

          print()
          print("===== HTTP =====")
          print("requested:", url)
          print("status:", response.status_code)
          print("final_url:", response.url)
          print("content_type:", response.headers.get("content-type"))
          print("content_length:", len(response.content))

          response.raise_for_status()

          if (
              not response.encoding
              or response.encoding.lower()
              in ["iso-8859-1", "ascii"]
          ):
              response.encoding = response.apparent_encoding

          html = response.text

          with open(
              "netkeiba_result_raw.html",
              "w",
              encoding="utf-8",
          ) as f:
              f.write(html)

          soup = BeautifulSoup(
              html,
              "html.parser",
          )

          title = ""

          if soup.title:
              title = soup.title.get_text(
                  " ",
                  strip=True,
              )

          body_text = soup.get_text(
              " ",
              strip=True,
          )

          print()
          print("===== PAGE =====")
          print("title:", title)
          print("html_chars:", len(html))
          print("text_chars:", len(body_text))

          keywords = [
              "着順",
              "馬名",
              "タイム",
              "上り",
              "ハロンタイム",
              "コーナー通過順位",
              "払戻",
              "オッズ",
              "netkeiba",
          ]

          print()
          print("===== KEYWORDS =====")

          keyword_result = {}

          for keyword in keywords:
              exists = keyword in body_text
              keyword_result[keyword] = exists
              print(
                  keyword,
                  ":",
                  exists,
              )

          print()
          print("===== TABLES =====")

          tables = soup.find_all("table")

          print(
              "table_count:",
              len(tables),
          )

          table_info = []

          for index, table in enumerate(
              tables,
              start=1,
          ):
              classes = table.get(
                  "class",
                  [],
              )

              table_text = re.sub(
                  r"\s+",
                  " ",
                  table.get_text(
                      " ",
                      strip=True,
                  ),
              )

              rows = table.find_all("tr")

              info = {
                  "index": index,
                  "classes": classes,
                  "row_count": len(rows),
                  "text_preview": table_text[:500],
              }

              table_info.append(info)

              print()
              print(
                  f"TABLE {index}"
              )
              print(
                  "classes:",
                  classes,
              )
              print(
                  "rows:",
                  len(rows),
              )
              print(
                  "preview:",
                  table_text[:500],
              )

          print()
          print("===== TR ANALYSIS =====")

          all_rows = soup.find_all("tr")

          print(
              "all_tr_count:",
              len(all_rows),
          )

          row_info = []

          for index, row in enumerate(
              all_rows,
              start=1,
          ):
              cells = row.find_all(
                  ["th", "td"]
              )

              if not cells:
                  continue

              row_text = re.sub(
                  r"\s+",
                  " ",
                  row.get_text(
                      " ",
                      strip=True,
                  ),
              )

              cell_info = []

              for cell_index, cell in enumerate(
                  cells,
                  start=1,
              ):
                  cell_text = re.sub(
                      r"\s+",
                      " ",
                      cell.get_text(
                          " ",
                          strip=True,
                      ),
                  )

                  cell_info.append(
                      {
                          "index": cell_index,
                          "tag": cell.name,
                          "classes": cell.get(
                              "class",
                              [],
                          ),
                          "text": cell_text[:200],
                      }
                  )

              row_data = {
                  "index": index,
                  "classes": row.get(
                      "class",
                      [],
                  ),
                  "cell_count": len(cells),
                  "text": row_text[:1000],
                  "cells": cell_info,
              }

              row_info.append(
                  row_data
              )

              if index <= 40:
                  print()
                  print(
                      f"ROW {index}"
                  )
                  print(
                      "classes:",
                      row.get(
                          "class",
                          [],
                      ),
                  )
                  print(
                      "cells:",
                      len(cells),
                  )
                  print(
                      "text:",
                      row_text[:1000],
                  )

                  for cell in cell_info:
                      print(
                          "  CELL",
                          cell["index"],
                          "tag=",
                          cell["tag"],
                          "class=",
                          cell["classes"],
                          "text=",
                          cell["text"],
                      )

          print()
          print("===== HORSE LINKS =====")

          horse_links = []

          for link in soup.find_all(
              "a",
              href=True,
          ):
              href = link.get(
                  "href",
                  "",
              )

              if (
                  "/horse/" in href
                  or "horse.netkeiba.com" in href
              ):
                  name = re.sub(
                      r"\s+",
                      " ",
                      link.get_text(
                          " ",
                          strip=True,
                      ),
                  )

                  horse_links.append(
                      {
                          "text": name,
                          "href": href,
                      }
                  )

          print(
              "horse_link_count:",
              len(horse_links),
          )

          for item in horse_links[:30]:
              print(
                  item["text"],
                  "=>",
                  item["href"],
              )

          print()
          print("===== CLASS NAMES =====")

          class_names = set()

          for element in soup.find_all(
              class_=True
          ):
              for class_name in element.get(
                  "class",
                  [],
              ):
                  class_names.add(
                      str(class_name)
                  )

          interesting_classes = sorted(
              class_name
              for class_name in class_names
              if any(
                  keyword.lower()
                  in class_name.lower()
                  for keyword in [
                      "race",
                      "result",
                      "horse",
                      "rank",
                      "order",
                      "time",
                      "agari",
                      "corner",
                      "odds",
                      "pop",
                      "num",
                  ]
              )
          )

          for class_name in interesting_classes:
              print(class_name)

          diagnosis = {
              "race_id": race_id,
              "requested_url": url,
              "final_url": response.url,
              "status_code": response.status_code,
              "content_type": response.headers.get(
                  "content-type"
              ),
              "content_length": len(
                  response.content
              ),
              "html_chars": len(html),
              "title": title,
              "keywords": keyword_result,
              "table_count": len(
                  tables
              ),
              "all_tr_count": len(
                  all_rows
              ),
              "horse_link_count": len(
                  horse_links
              ),
              "tables": table_info,
              "rows": row_info,
              "horse_links": horse_links,
              "interesting_classes": (
                  interesting_classes
              ),
          }

          with open(
              "netkeiba_html_diagnosis.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  diagnosis,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print()
          print("===== DIAGNOSIS SUMMARY =====")
          print(
              "status:",
              response.status_code,
          )
          print(
              "title:",
              title,
          )
          print(
              "tables:",
              len(tables),
          )
          print(
              "rows:",
              len(all_rows),
          )
          print(
              "horse links:",
              len(horse_links),
          )

          if len(html) < 1000:
              print(
                  "WARNING: HTML is unusually small."
              )

          if not horse_links:
              print(
                  "WARNING: No horse links detected."
              )

          if not tables:
              print(
                  "WARNING: No HTML tables detected."
              )

          print(
              "HTML INSPECTION COMPLETE"
          )
          PY

      - name: Show diagnosis JSON
        if: always()
        run: |
          if [ -f netkeiba_html_diagnosis.json ]; then
            cat netkeiba_html_diagnosis.json
          else
            echo "diagnosis JSON was not created"
          fi

      - name: Upload HTML diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netkeiba-html-diagnosis
          path: |
            netkeiba_result_raw.html
            netkeiba_html_diagnosis.json
          if-no-files-found: error
