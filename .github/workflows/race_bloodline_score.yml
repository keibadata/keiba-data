name: Race Bloodline Score

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calculate race bloodline scores
        run: python race_bloodline_score.py

      - name: Save race bloodline scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add race_bloodline_score.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update race bloodline scores"
            git push
          fi
