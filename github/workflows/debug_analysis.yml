name: Race Debug Analysis

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Run only this step"
        required: true
        default: "history_pedigree"
        type: choice
        options:
          - history_pedigree
          - runner_history
          - runner_time_fit
          - runner_analysis
          - previous_race_analysis
          - pace_analysis
          - bloodline_stats
          - race_bloodline_score
          - final_analysis

permissions:
  contents: write

concurrency:
  group: race-debug-analysis
  cancel-in-progress: false

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Load race ID
        run: |
          RACE_ID="$(tr -d '[:space:]' < race_id.txt)"

          if ! [[ "$RACE_ID" =~ ^[0-9]{12}$ ]]; then
            echo "ERROR: race_id.txt must contain exactly 12 digits"
            exit 1
          fi

          echo "RACE_ID=$RACE_ID" >> "$GITHUB_ENV"
          echo "Target race: $RACE_ID"
          echo "Debug target: ${{ inputs.target }}"

      # ==================================================
      # 選択した1工程だけ実行
      # ==================================================

      - name: Collect history pedigree
        if: inputs.target == 'history_pedigree'
        run: python history_pedigree.py

      - name: Collect runner history
        if: inputs.target == 'runner_history'
        run: python runner_history.py

      - name: Analyze runner time fit
        if: inputs.target == 'runner_time_fit'
        run: python runner_time_fit.py

      - name: Analyze runners
        if: inputs.target == 'runner_analysis'
        run: python runner_analysis.py

      - name: Analyze previous race
        if: inputs.target == 'previous_race_analysis'
        run: python previous_race_analysis.py

      - name: Analyze pace
        if: inputs.target == 'pace_analysis'
        run: python pace_analysis.py

      - name: Build bloodline statistics
        if: inputs.target == 'bloodline_stats'
        run: python bloodline_stats.py

      - name: Score race bloodlines
        if: inputs.target == 'race_bloodline_score'
        run: python race_bloodline_score.py

      - name: Run final analysis
        if: inputs.target == 'final_analysis'
        run: python final_analysis.py

      # ==================================================
      # 実行結果だけ保存
      # ==================================================

      - name: Commit debug result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          case "${{ inputs.target }}" in
            history_pedigree)
              OUTPUT="history_pedigree.json"
              ;;
            runner_history)
              OUTPUT="runner_history.json"
              ;;
            runner_time_fit)
              OUTPUT="runner_time_fit.json"
              ;;
            runner_analysis)
              OUTPUT="runner_analysis.json"
              ;;
            previous_race_analysis)
              OUTPUT="previous_race_analysis.json"
              ;;
            pace_analysis)
              OUTPUT="pace_analysis.json"
              ;;
            bloodline_stats)
              OUTPUT="bloodline_stats.json"
              ;;
            race_bloodline_score)
              OUTPUT="race_bloodline_score.json"
              ;;
            final_analysis)
              OUTPUT="final_analysis.json"
              ;;
            *)
              echo "ERROR: unknown debug target"
              exit 1
              ;;
          esac

          if [ ! -f "$OUTPUT" ]; then
            echo "ERROR: expected output not generated: $OUTPUT"
            exit 1
          fi

          echo "Generated: $OUTPUT"

          git add -- "$OUTPUT"

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m \
            "Debug ${{ inputs.target }} ${RACE_ID}"

          git push
